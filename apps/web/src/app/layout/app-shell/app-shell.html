<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="app-header">
  <div class="app-header__inner">
    <span class="app-header__brand">{{ productName }}</span>
    <nav class="app-header__nav" aria-label="Primary">
      <a routerLink="/" class="app-header__link">Home</a>
      <a routerLink="/account" class="app-header__link" data-testid="nav-account">Account</a>
      @if (isAdmin()) {
        <a routerLink="/admin" class="app-header__link" data-testid="nav-admin">Admin</a>
      }
    </nav>
  </div>
</header>

<main id="main-content" class="app-main" tabindex="-1">
  <div class="app-main__inner">
    <router-outlet />
  </div>
</main>
